<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream BJO</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#0f0f17;color:#fff;padding-bottom:90px}header{background:#6d28d9;padding:14px}h1{margin:0;font-size:18px}.s{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px}.c{background:#1c1c28;padding:10px;border-radius:10px}.q{padding:8px}.q input{width:100%;padding:12px;border-radius:10px;border:0;background:#1c1c28;color:#fff}.cu{background:#1c1c28;margin:10px;border-radius:14px;overflow:hidden}.h{background:#252538;padding:10px;display:flex;justify-content:space-between}.cl{padding:10px;border-top:1px solid #333;display:flex;justify-content:space-between}.fab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#6d28d9;color:#fff;font-size:32px;border:0}.m{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;z-index:99}.m.on{display:flex}.b{background:#181825;width:95%;max-width:400px;border-radius:16px;padding:16px;margin-top:20px;overflow-y:auto;max-height:90vh}.b input,.b select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:0;background:#252538;color:#fff}.sl{background:#1c1c28;padding:10px;border-radius:10px;margin:8px 0;border:1px solid #333}</style></head><body><header><h1>📺 Stream BJO</h1><small>3 clientes x cuenta - Bermejo</small></header><div class="s"><div class="c">Cuentas:<b id="sc">0</b></div><div class="c">Clientes:<b id="scl">0</b></div><div class="c">No pagó:<b id="sd">0</b></div><div class="c">Gana:<b id="sg">$0</b></div></div><div class="q"><input id="qq" placeholder="Buscar..."></div><div id="lista"></div><button class="fab" id="add">+</button><div class="m" id="mc"><div class="b"><h3>Nueva Cuenta</h3><input id="cn" placeholder="Nombre cuenta"><select id="cp"><option value="netflix">Netflix</option><option value="disney">Disney+</option><option value="prime">Prime</option><option value="hbo">Max</option></select><input id="cc" placeholder="Correo"><input id="cpas" placeholder="Clave"><input id="ccos" type="number" placeholder="Costo"><div id="slots"></div><button id="gs" style="width:100%;background:#6d28d9;color:#fff;padding:12px;border-radius:10px;border:0;font-weight:800">GUARDAR</button><button id="cs" style="width:100%;background:#333;color:#888;padding:10px;border-radius:10px;border:0;margin-top:6px">CANCELAR</button></div></div><script>let K='bjo_cel_v1',cs=[];try{cs=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}function sv(){localStorage.setItem(K,JSON.stringify(cs))}function f30(){let d=new Date();d.setDate(d.getDate()+30);return d.toISOString().slice(0,10)}function mks(d){let w=document.getElementById('slots'),di=document.createElement('div');di.className='sl';di.innerHTML=`<input class="sn" value="${d?d.n:''}" placeholder="Nombre cliente"><input class="sw" value="${d?d.w:''}" placeholder="WhatsApp"><input class="sv" type="date" value="${d?d.v:f30()}"><input class="sp" type="number" value="${d?d.p:''}" placeholder="Precio"><label><input type="checkbox" class="spg" ${d&&d.pg?'checked':''}> Pagado</label>`;w.appendChild(di)}function openM(e){document.getElementById('slots').innerHTML='';document.getElementById('cn').value=e?e.n:'';document.getElementById('cp').value=e?e.pl:'netflix';document.getElementById('cc').value=e?e.c:'';document.getElementById('cpas').value=e?e.ps:'';document.getElementById('ccos').value=e?e.co:'';document.getElementById('mc').dataset.id=e?e.id:'';if(e)e.cl.forEach(mks);else for(let i=0;i<3;i++)mks();document.getElementById('mc').classList.add('on')}document.getElementById('add').onclick=()=>openM();document.getElementById('cs').onclick=()=>document.getElementById('mc').classList.remove('on');document.getElementById('gs').onclick=()=>{let sl=[...document.getElementById('slots').children].map(s=>({n:s.querySelector('.sn').value,w:s.querySelector('.sw').value,v:s.querySelector('.sv').value,p:parseFloat(s.querySelector('.sp').value)||0,pg:s.querySelector('.spg').checked})).filter(x=>x.n);if(!sl.length)return alert('Poné 1 cliente');let id=document.getElementById('mc').dataset.id||Date.now()+'',ob={id,n:document.getElementById('cn').value||'Cuenta',pl:document.getElementById('cp').value,c:document.getElementById('cc').value,ps:document.getElementById('cpas').value,co:parseFloat(document.getElementById('ccos').value)||0,cl:sl};let i=cs.findIndex(x=>x.id==id);if(i>=0)cs[i]=ob;else cs.push(ob);sv();document.getElementById('mc').classList.remove('on');ren()};document.getElementById('qq').oninput=ren;function ren(){let q=document.getElementById('qq').value.toLowerCase(),L=document.getElementById('lista'),t=0,d=0,g=0,co=0;cs.forEach(c=>{co+=c.co;t+=c.cl.length;c.cl.forEach(x=>{if(!x.pg)d++;else g+=x.p});});g-=co;let f=cs.filter(c=>(c.n+c.pl).toLowerCase().includes(q));L.innerHTML=f.length?'':'<p style="text-align:center;opacity:.5;margin-top:60px">Toca + para agregar<br>3 clientes x cuenta</p>';f.forEach(c=>{let h=`<div class="cu"><div class="h"><div><b>${c.n} (${c.cl.length}/3)</b><br><small>${c.c}|${c.ps}</small></div><div><button onclick="edit('${c.id}')">✏️</button><button onclick="del('${c.id}')">🗑️</button></div></div>`;c.cl.forEach((cl,i)=>{h+=`<div class="cl" style="${!cl.pg?'background:#2a1a1a':''}"><div><b>${cl.n} $${cl.p}</b><br><small>${cl.v}</small></div><div><button onclick="tog('${c.id}',${i})">${cl.pg?'Pagó':'Debe'}</button></div></div>`});L.innerHTML+=h+'</div>'});sc.textContent=cs.length;scl.textContent=t;sd.textContent=d;sg.textContent='$'+g}window.edit=id=>{let c=cs.find(x=>x.id==id);if(c)openM(c)};window.del=id=>{if(confirm('Borrar?')){cs=cs.filter(x=>x.id!=id);sv();ren()}};window.tog=(id,i)=>{let c=cs.find(x=>x.id==id);c.cl[i].pg=!c.cl[i].pg;sv();ren()};ren();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
